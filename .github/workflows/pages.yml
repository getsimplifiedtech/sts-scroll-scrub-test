name: Build and deploy scrub spike

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffmpeg -hide_banner -encoders | grep -q libwebp

      - name: Download approved 1280x768 production clip
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/getsimplifiedtech/getsimplifiedtech-sts-hero-assets/main/output_71133.mp4" --output source.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=noprint_wrappers=1 source.mp4

      - name: Build 60, 90 and 120 frame WebP sets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/frames
          cp index.html scrub.css scrub.js _site/

          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 source.mp4)"
          echo "Source duration: $duration"

          make_set () {
            key="$1"
            count="$2"
            width="$3"
            height="$4"

            mkdir -p "_site/frames/$key"
            rate="$(awk -v n="$count" -v d="$duration" 'BEGIN { printf "%.12f", n/d }')"

            echo "Building $key: $count frames at $width x $height, sample rate $rate fps"

            ffmpeg -hide_banner -loglevel error -y \
              -i source.mp4 \
              -vf "fps=$rate,scale=$width:$height:flags=lanczos" \
              -frames:v "$count" \
              -c:v libwebp \
              -quality 80 \
              -compression_level 6 \
              -start_number 0 \
              "_site/frames/$key/%03d.webp"

            actual="$(find "_site/frames/$key" -maxdepth 1 -name '*.webp' | wc -l)"
            test "$actual" -eq "$count"
          }

          make_set 60    60  1280 768
          make_set 60-m  60   960 576
          make_set 90    90  1280 768
          make_set 90-m  90   960 576
          make_set 120  120  1280 768
          make_set 120-m 120   960 576

      - name: Generate measured manifest
        shell: bash
        run: |
          set -euo pipefail

          bytes_for () {
            find "_site/frames/$1" -maxdepth 1 -name '*.webp' -printf '%s\n' | awk '{s+=$1} END {print s+0}'
          }

          b60="$(bytes_for 60)"
          b60m="$(bytes_for 60-m)"
          b90="$(bytes_for 90)"
          b90m="$(bytes_for 90-m)"
          b120="$(bytes_for 120)"
          b120m="$(bytes_for 120-m)"

          cat > _site/frames/manifest.json <<EOF
          {
            "60":   { "bytes": $b60,   "w": 1280, "h": 768 },
            "60-m": { "bytes": $b60m,  "w": 960,  "h": 576 },
            "90":   { "bytes": $b90,   "w": 1280, "h": 768 },
            "90-m": { "bytes": $b90m,  "w": 960,  "h": 576 },
            "120":  { "bytes": $b120,  "w": 1280, "h": 768 },
            "120-m":{ "bytes": $b120m, "w": 960,  "h": 576 }
          }
          EOF

          cat _site/frames/manifest.json

      - name: Add no-Jekyll marker
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
