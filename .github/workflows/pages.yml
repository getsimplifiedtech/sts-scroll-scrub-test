name: Generate scrub frame assets

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scrub.css"
      - "scrub.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrub-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffmpeg -hide_banner -encoders | grep -q libwebp

      - name: Download approved 1280x768 production clip
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/getsimplifiedtech/getsimplifiedtech-sts-hero-assets/main/output_71133.mp4" --output source.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=noprint_wrappers=1 source.mp4

      - name: Generate 60, 90 and 120 frame WebP sets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frames
          mkdir -p frames

          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 source.mp4)"
          echo "Source duration: $duration"

          make_set () {
            key="$1"
            count="$2"
            width="$3"
            height="$4"

            mkdir -p "frames/$key"
            rate="$(awk -v n="$count" -v d="$duration" 'BEGIN { printf "%.12f", n/d }')"

            echo "Building $key: $count frames at $width x $height, sample rate $rate fps"

            ffmpeg -hide_banner -loglevel error -y \
              -i source.mp4 \
              -vf "fps=$rate,scale=$width:$height:flags=lanczos" \
              -frames:v "$count" \
              -c:v libwebp \
              -quality 80 \
              -compression_level 6 \
              -start_number 0 \
              "frames/$key/%03d.webp"

            actual="$(find "frames/$key" -maxdepth 1 -name '*.webp' | wc -l)"
            test "$actual" -eq "$count"
          }

          make_set 60    60  1280 768
          make_set 60-m  60   960 576
          make_set 90    90  1280 768
          make_set 90-m  90   960 576
          make_set 120  120  1280 768
          make_set 120-m 120   960 576

      - name: Generate measured manifest
        shell: bash
        run: |
          set -euo pipefail

          bytes_for () {
            find "frames/$1" -maxdepth 1 -name '*.webp' -printf '%s\n' | awk '{s+=$1} END {print s+0}'
          }

          b60="$(bytes_for 60)"
          b60m="$(bytes_for 60-m)"
          b90="$(bytes_for 90)"
          b90m="$(bytes_for 90-m)"
          b120="$(bytes_for 120)"
          b120m="$(bytes_for 120-m)"

          cat > frames/manifest.json <<EOF
          {
            "60":   { "bytes": $b60,   "w": 1280, "h": 768 },
            "60-m": { "bytes": $b60m,  "w": 960,  "h": 576 },
            "90":   { "bytes": $b90,   "w": 1280, "h": 768 },
            "90-m": { "bytes": $b90m,  "w": 960,  "h": 576 },
            "120":  { "bytes": $b120,  "w": 1280, "h": 768 },
            "120-m":{ "bytes": $b120m, "w": 960,  "h": 576 }
          }
          EOF

          cat frames/manifest.json

      - name: Commit generated frame assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frames
          if git diff --cached --quiet; then
            echo "Frame assets unchanged."
            exit 0
          fi
          git commit -m "Generate scrub frame assets [skip ci]"
          git push origin HEAD:main
